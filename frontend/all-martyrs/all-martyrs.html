<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="جستجوی جامع اطلاعات شهدای گلزار شهدای تهران">
  <title>جستجوی کل شهدا | گلزار شهدای تهران</title>
  <link rel="stylesheet" href="all-martyrs.css?v=20260903-03">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<main class="all-martyrs-page">
  <header class="all-martyrs-header">
    <a class="all-martyrs-back-home" href="../index.html">← بازگشت به صفحه اصلی</a>
    <h1>جستجوی کل شهدا</h1>
    <p>جستجو در اطلاعات شهدای داخل و خارج گلزار</p>
  </header>

  <section class="all-martyrs-panel">
    <form id="all-martyrs-form" class="all-martyrs-form">
      <input id="all-martyrs-query" type="search" autocomplete="off" placeholder="نام، نام خانوادگی، نام پدر، قطعه، ردیف یا شماره مزار…">
      <select id="all-martyrs-field" aria-label="فیلد جستجو"><option value="all">جستجو در همه فیلدها</option></select>
      <button type="submit">جستجو</button>
    </form>

    <div class="all-martyrs-combined">
      <div class="all-martyrs-combined-head"><div><strong>فیلترهای دقیق</strong><small>برای محدود کردن نتیجه، یک یا چند شرط اضافه کنید.</small></div><button id="all-martyrs-add-filter" type="button">+ افزودن شرط</button></div>
      <div id="all-martyrs-filters"></div>
    </div>

    <div id="all-martyrs-status" class="all-martyrs-status">در حال آماده‌سازی اطلاعات…</div>
    <div id="all-martyrs-error" class="all-martyrs-error" hidden></div>
    <div id="all-martyrs-output"></div>
  </section>
</main>

<script src="all-martyrs-normalizer.js?v=20260903-03"></script>
<script src="all-martyrs-data.js?v=20260903-03"></script>
<script src="all-martyrs-search.js?v=20260903-03"></script>
<script src="all-martyrs-ui.js?v=20260903-03"></script>
<script>
(async function () {
  const form = document.getElementById("all-martyrs-form");
  const query = document.getElementById("all-martyrs-query");
  const field = document.getElementById("all-martyrs-field");
  const filtersBox = document.getElementById("all-martyrs-filters");
  const addFilter = document.getElementById("all-martyrs-add-filter");
  const status = document.getElementById("all-martyrs-status");
  const output = document.getElementById("all-martyrs-output");
  const error = document.getElementById("all-martyrs-error");
  let records = [];
  let lastResults = [];
  let lastSearchState = { query: "", field: "all", filters: {} };
  let currentRecord = null;

  Object.entries(AllMartyrsSearch.FIELDS).forEach(([key, label]) => {
    const option = document.createElement("option"); option.value = key; option.textContent = label; field.appendChild(option);
  });

  function optionsForField(key) {
    if (key === "birth_month" || key === "death_month") return AllMartyrsSearch.MONTH_OPTIONS.map(o => `<option value="${o.value}">${o.label}</option>`).join("");
    if (key === "grave_piece") return AllMartyrsSearch.PIECE_OPTIONS.filter(o => o.value !== "").map(o => `<option value="${o.value}">${o.label}</option>`).join("");
    return "";
  }

  function addFilterRow(key = "grave_piece") {
    const row = document.createElement("div"); row.className = "all-martyrs-filter-row";
    row.innerHTML = `<select class="filter-key" aria-label="فیلد شرط">${Object.entries(AllMartyrsSearch.FIELDS).map(([k,l]) => `<option value="${k}" ${k===key?"selected":""}>${l}</option>`).join("")}</select><div class="filter-value-wrap"></div><button type="button" class="filter-remove">حذف</button>`;
    const keySelect = row.querySelector(".filter-key"), valueWrap = row.querySelector(".filter-value-wrap");
    function refreshValue() {
      const selected = keySelect.value;
      if (selected === "grave_piece") valueWrap.innerHTML = `<select class="filter-value" aria-label="مقدار قطعه"><option value="">انتخاب قطعه…</option>${optionsForField(selected)}</select>`;
      else if (selected === "birth_month" || selected === "death_month") valueWrap.innerHTML = `<select class="filter-value" aria-label="ماه"><option value="">انتخاب ماه…</option>${optionsForField(selected)}</select>`;
      else valueWrap.innerHTML = `<input class="filter-value" type="text" aria-label="مقدار شرط" placeholder="مقدار شرط…">`;
    }
    keySelect.addEventListener("change", refreshValue);
    row.querySelector(".filter-remove").addEventListener("click", () => row.remove());
    refreshValue(); filtersBox.appendChild(row);
  }
  addFilter.addEventListener("click", () => addFilterRow());

  function readFilters() {
    const filters = {};
    filtersBox.querySelectorAll(".all-martyrs-filter-row").forEach(row => {
      const key = row.querySelector(".filter-key").value, value = row.querySelector(".filter-value").value;
      if (value) filters[key] = value;
    });
    return filters;
  }

  function renderResults(results) {
    lastResults = results;
    const limit = 200;
    const shown = results.slice(0, limit);
    AllMartyrsUI.render(output, shown, results.length, { canExport: true });
    if (results.length > limit) {
      const note = document.createElement("div"); note.className = "all-martyrs-more-note";
      note.textContent = `برای سرعت بیشتر، ${AllMartyrsUI.faDigits(limit)} نتیجه اول نمایش داده شده است؛ خروجی Excel شامل هر ${AllMartyrsUI.faDigits(results.length)} نتیجه است.`;
      output.prepend(note);
    }
  }

  function exportExcel() {
    if (!lastResults.length || !window.XLSX) return;
    const rows = lastResults.map(r => ({
      "نام": r.first_name, "نام خانوادگی": r.last_name, "نام پدر": r.father_name, "جنسیت": r.gender,
      "روز تولد": r.birth_date.day, "ماه تولد": r.birth_date.month, "سال تولد": r.birth_date.year,
      "روز شهادت": r.death_date.day, "ماه شهادت": r.death_date.month, "سال شهادت": r.death_date.year,
      "سن": r.age_display, "عملیات / دسته‌بندی شهادت": r.martyrdom_category, "منطقه / محل شهادت": r.martyrdom_location,
      "قطعه مزار": r.grave_piece, "ردیف مزار": r.grave_row, "شماره مزار": r.grave_number, "منبع": r.source === "outside" ? "قطعات عمومی بهشت زهرا" : "گلزار"
    }));
    const sheet = XLSX.utils.json_to_sheet(rows), book = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(book, sheet, "نتایج جستجو");
    XLSX.writeFile(book, "جستجوی-کل-شهدا.xlsx");
  }

  function showDetail(record) { currentRecord = record; AllMartyrsUI.detail(output, record); }
  function showEdit(record) { currentRecord = record; AllMartyrsUI.edit(output, record); }
  function returnToResults() { renderResults(lastResults); }

  output.addEventListener("click", event => {
    const actionEl = event.target.closest("[data-action]"); if (!actionEl) return;
    const action = actionEl.dataset.action;
    if (action === "detail" || action === "edit") {
      const record = records.find(r => r.id === actionEl.dataset.recordId); if (!record) return;
      action === "detail" ? showDetail(record) : showEdit(record); return;
    }
    if (action === "back") { returnToResults(); return; }
    if (action === "export") { exportExcel(); return; }
    if (action === "save-edit") {
      if (!currentRecord) return;
      output.querySelectorAll("[data-edit-field]").forEach(input => {
        const key = input.dataset.editField;
        if (["birth_day","birth_month","birth_year"].includes(key)) currentRecord.birth_date = AllMartyrsNormalizer.normalizeDate(key === "birth_day" ? input.value : currentRecord.birth_date.day, key === "birth_month" ? input.value : currentRecord.birth_date.month, key === "birth_year" ? input.value : currentRecord.birth_date.year);
        else if (["death_day","death_month","death_year"].includes(key)) currentRecord.death_date = AllMartyrsNormalizer.normalizeDate(key === "death_day" ? input.value : currentRecord.death_date.day, key === "death_month" ? input.value : currentRecord.death_date.month, key === "death_year" ? input.value : currentRecord.death_date.year);
        else currentRecord[key] = input.value;
      });
      currentRecord.age_calculated = null; currentRecord.age_display = currentRecord.age_raw || "";
      showDetail(currentRecord);
    }
  });

  try {
    if (!window.XLSX) throw new Error("کتابخانه Excel (XLSX) بارگذاری نشده است.");
    const loaded = await AllMartyrsData.load(); records = loaded.records;
    status.textContent = `اطلاعات آماده جستجو — ${AllMartyrsUI.faDigits(loaded.counts.total.toLocaleString("en-US"))} رکورد در دو منبع`;
    AllMartyrsUI.render(output, [], 0, { canExport: false });
  } catch (e) {
    console.error("All Martyrs Search load error:", e); status.textContent = "بارگذاری اطلاعات ناموفق بود."; error.hidden = false; error.textContent = e.message || "خطای نامشخص در بارگذاری داده‌ها.";
  }

  form.addEventListener("submit", event => {
    event.preventDefault(); if (!records.length) return;
    lastSearchState = { query: query.value, field: field.value, filters: readFilters() };
    renderResults(AllMartyrsSearch.search(records, lastSearchState));
  });
})();
</script>
</body>
</html>
