<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="description" content="سامانه مستقل جستجو و مدیریت اطلاعات شهدا"><title>سامانه شهدا | گلزار شهدای تهران</title>
  <link rel="stylesheet" href="all-martyrs.css?v=20260903-07">

<body><main class="all-martyrs-page all-martyrs-landing">
  <header class="all-martyrs-header">
    <a class="all-martyrs-back-home" href="../index.html">بازگشت به صفحه اصلی</a>
    <h1>سامانه اطلاعات شهدا</h1>
    <p>لطفاً بخش موردنظر خود را انتخاب کنید</p>
  </header>
  <section class="all-martyrs-panel all-martyrs-landing-panel">
    <div class="all-martyrs-main-actions">
      <a class="all-martyrs-main-action search" href="all-martyrs-search.html"><span class="action-icon">⌕</span><span><strong>جستجوی کل شهدا</strong><small>جستجو در اطلاعات شهدای داخل و خارج گلزار</small></span><span class="action-arrow">‹</span></a>

    </div>
  </section>
</main>
<script>
document.querySelectorAll("[data-entry]").forEach(button=>button.addEventListener("click",()=>alert(button.dataset.entry==="single"?"ورود تکی اطلاعات شهدا در مرحله بعدی فعال می‌شود.":"ورود جمعی اطلاعات شهدا در مرحله بعدی فعال می‌شود.")));
