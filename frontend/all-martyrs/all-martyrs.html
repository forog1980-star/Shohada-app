<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="description" content="سامانه مستقل جستجو و مدیریت اطلاعات شهدا"><title>سامانه شهدا | گلزار شهدای تهران</title>

<body><main class="all-martyrs-page all-martyrs-landing">

    <h1>سامانه اطلاعات شهدا</h1>

<script>
document.querySelectorAll("[data-entry]").forEach(button=>button.addEventListener("click",()=>alert(button.dataset.entry==="single"?"افزودن نام تکی در مرحله بعدی فعال می‌شود.":"افزودن نام گروهی در مرحله بعدی فعال می‌شود.")));
