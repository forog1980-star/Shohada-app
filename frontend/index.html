<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#263238"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <title>GolzarStone</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="app">

    <header class="header">

        <h1>
            بهسازی سنگ شهدا
        </h1>

        <p>
            سامانه مدیریت و پایش سنگ مزار
        </p>

    </header>

    <main class="menu">

        <button
            class="menu-button"
            type="button"
            onclick="showSearch()"
        >

            <span class="icon">🔎</span>

            جستجوی شهید

            <span class="description">
                مشاهده اطلاعات و وضعیت سنگ
            </span>

        </button>


        <button
            class="menu-button"
            type="button"
            onclick="showNewMartyr()"
        >

            <span class="icon">➕</span>

            ثبت شهید جدید

            <span class="description">
                ثبت سریع اطلاعات شهید در محل
            </span>

        </button>


        <button
            class="menu-button"
            type="button"
            onclick="showPending()"
        >

            <span class="icon">📋</span>

            اطلاعات ثبت‌شده

            <span class="description">
                مشاهده موارد ثبت‌شده و در انتظار تأیید
            </span>

        </button>

    </main>

    <footer class="footer">

        GolzarStone

        <br>

        پروژه بهسازی سنگ‌های شهدا

    </footer>

</div>

<script src="app.js"></script>

</body>

</html>
