<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#17633d">
    <meta name="description" content="سامانه مدیریت و پایش سنگ مزار گلزار شهدای تهران">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>گلزار شهدای تهران | سامانه مدیریت و پایش سنگ مزار</title>
    <style>html,body{margin:0;padding:0;min-height:100%;background:#f4f7f5}body{overflow-x:hidden}</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app"></div>
<script src="navigation-fix.js?v=20260906-02"></script>
<script src="master-loader.js?v=20260906-02"></script>
<script src="version-label.js?v=20260904-01"></script>
<script src="pwa-bootstrap.js"></script>
<script>
(function(){
  let attempts=0;
  const launcherSrc="all-martyrs-home.js?v=20260905-01";
  const loadLauncher=function(onReady){
    if(window.__ALL_MARTYRS_HOME_LOADED__===true){onReady();return;}
    const existing=document.querySelector('script[data-all-martyrs-home="true"]');
    if(existing){
      existing.addEventListener("load",onReady,{once:true});
      existing.addEventListener("error",onReady,{once:true});
      return;
    }
    const script=document.createElement("script");
    script.src=launcherSrc;
    script.dataset.allMartyrsHome="true";
    script.onload=()=>{window.__ALL_MARTYRS_HOME_LOADED__=true;onReady();};
    script.onerror=()=>{console.error("GolzarStone launcher load failed:",launcherSrc);onReady();};
    document.body.appendChild(script);
  };
  const start=function(){
    if(window.__GOLZAR_MASTER_READY__!==true){
      attempts++;
      if(attempts<300){setTimeout(start,100);return;}
      console.error("GolzarStone app startup timeout.");
      return;
    }
    loadLauncher(function(){
      try{
        if(typeof window.initializeHistory==="function")window.initializeHistory();
        if(typeof window.applyAppStyles==="function")window.applyAppStyles();
        if(typeof window.showHome==="function")window.showHome();
        if(typeof window.installStatsLabel==="function")window.installStatsLabel();
        if(typeof window.installVersionLabel==="function")window.installVersionLabel();
      }catch(e){console.error("GolzarStone app startup error:",e)}
    });
  };
  start();
})();
</script>
</body>
</html>
