<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#17633d"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <title>
        GolzarStone
    </title>


    <!-- =====================================================
         CSS اصلی برنامه
         ===================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


</head>


<body>


    <!-- =====================================================
         بدنه اصلی برنامه
         ===================================================== -->

    <div class="app">

        <header class="header">

            <h1>
                گلزار شهدای تهران
            </h1>

            <p>
                سامانه مدیریت و پایش سنگ مزار
            </p>

        </header>


        <main class="menu">

            <button
                class="menu-button"
                type="button"
            >

                <span class="icon">
                    🔎
                </span>

                جستجوی شهید

                <span class="description">
                    مشاهده اطلاعات و وضعیت سنگ
                </span>

            </button>


            <button
                class="menu-button"
                type="button"
            >

                <span class="icon">
                    ➕
                </span>

                ثبت شهید جدید

                <span class="description">
                    ثبت سریع اطلاعات شهید در محل
                </span>

            </button>


            <button
                class="menu-button"
                type="button"
            >

                <span class="icon">
                    📋
                </span>

                اطلاعات ثبت‌شده

                <span class="description">
                    مشاهده موارد ثبت‌شده و در انتظار تأیید
                </span>

            </button>

        </main>


        <footer class="footer">

            گلزار شهدای تهران

            <br>

            سامانه بهسازی و پایش سنگ مزار شهدا

            <br>

            GolzarStone

        </footer>

    </div>



    <!-- =====================================================
         1. Supabase JavaScript Client
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- =====================================================
         2. SheetJS
         کتابخانه ساخت فایل Excel
         
         این قسمت برای دکمه «خروجی اکسل» ضروری است.
         ===================================================== -->

    <script
        src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
    ></script>



    <!-- =====================================================
         3. برنامه اصلی GolzarStone
         
         app.js باید بعد از Supabase و SheetJS لود شود.
         ===================================================== -->

    <script
        src="app.js"
    ></script>


</body>

</html>
