name: Deploy GolzarStone QA to GitHub Pages

on:
  push:
    branches:
      - fix/exact-filters-match-20260907
  workflow_dispatch:

concurrency:
  group: pages-qa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload QA frontend as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./frontend

      - name: Deploy QA to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
