name: Deploy GolzarStone to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-golzarstone
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages-qa
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main release
        uses: actions/checkout@v6

      - name: Validate Pages entry point
        shell: bash
        run: |
          test -f ./frontend/index.html
          test -s ./frontend/index.html
          grep -q '<title>' ./frontend/index.html
          echo "GitHub Pages entry point: frontend/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
