name: Temporary QA - Full AI Quality Panel

on:
  push:
    branches:
      - feature/ai-quality-full-page-20261007

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check frontend/ai-quality-panel.js

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build test harness
        shell: bash
        run: |
          cat > /tmp/qa-harness.html <<'HTML'
          <!doctype html>
          <html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>QA Harness</title></head>
          <body><div class="app"></div>
          <script>
          window.GOLZAR_AI_INDEX = (function(){
            const rows = [
              {id:9886,name:"طوبی",lastname:"حاجی ولی خانی",piece:"",grave_row:"",grave_number:"",stone_type:"ترمیمی",stage:""},
              {id:9903,name:"علی",lastname:"شمس بیگی",piece:"",grave_row:"",grave_number:"",stone_type:"ترمیمی",stage:""},
              {id:9912,name:"فتح الله",lastname:"تاجیک",piece:"",grave_row:"",grave_number:"",stone_type:"ترمیمی",stage:""}
            ];
            const ids = {
              "مرحله خالی":[9886,9903,9912],
              "نام/هویت تکراری یا چندرکوردی":[9912],
              "ردیف مزار خالی":[9886,9903,9912],
              "شماره مزار خالی":[9886,9903,9912],
              "موقعیت مزار تکراری":[],
              "نوع سنگ خالی":[],
              "قطعه خالی":[9886,9903,9912],
              "نام خالی":[],
              "خارج از محدوده ۸ قطعه آماری":[]
            };
            return {
              version:"0.2.0-live-index",
              refresh:async function(){},
              getSnapshot:function(){return {status:"ready",source:"Supabase public.martyrs",rowCount:3,updatedAt:"2026-10-07T06:00:00Z",error:null};},
              getLiveRows:function(){return rows.slice();},
              dataQuality:{
                getSummary:function(){return {totalRecords:3,clean:0,problem:3,issueCounts:{
                  "مرحله خالی":3,"نام/هویت تکراری یا چندرکوردی":1,"ردیف مزار خالی":3,"شماره مزار خالی":3,"موقعیت مزار تکراری":0,"نوع سنگ خالی":0,"قطعه خالی":3,"نام خالی":0,"خارج از محدوده ۸ قطعه آماری":0
                }};},
                getIssueIds:function(k){return ids[k]||[];}
              },
              dataIntelligence:{
                getSummary:function(){return {totalRecords:3,duplicateGroups:1,identityConflicts:1,locationConflicts:0,incompleteRecords:3,stageNormalizations:0,stageAnomalies:0};}
              }
            };
          })();
          </script>
          <script src="http://127.0.0.1:8000/frontend/ai-quality-panel.js"></script>
          </body></html>
          HTML

      - name: Start static server
        run: python3 -m http.server 8000 --directory . >/tmp/qa-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8000/qa-harness.html >/dev/null

      - name: Browser QA
        shell: bash
        run: |
          cat > /tmp/qa-test.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
          await page.goto('http://127.0.0.1:8000/qa-harness.html', {waitUntil:'networkidle'});
          await page.evaluate(() => window.GOLZAR_AI_QUALITY_PANEL.open());
          await page.locator('#golzar-ai-quality-modal').waitFor();
          const text = await page.locator('#golzar-ai-quality-modal').innerText();
          const required = ['کنترل کیفیت داده','لایه هوش مصنوعی: تحلیل و پایش کیفیت اطلاعات','کل رکوردها','نوع مشکلات','خلاصه Data Intelligence','رکوردها','تأیید اطلاعات وارد شده','رکوردهای برگشتی برای اصلاح','راهنمای مراحل عملیات','پاک کردن فیلترها'];
          for (const item of required) {
            if (!text.includes(item)) throw new Error('Missing UI text: ' + item);
          }
          if (await page.locator('#golzar-ai-quality-records-body tr').count() !== 3) throw new Error('Expected 3 records');
          await page.selectOption('#golzar-ai-quality-filter-piece','17');
          if (await page.locator('#golzar-ai-quality-records-body tr').count() !== 0) throw new Error('Piece filter failed');
          await page.selectOption('#golzar-ai-quality-filter-piece','all');
          await page.selectOption('#golzar-ai-quality-filter-status','duplicate');
          if (await page.locator('#golzar-ai-quality-records-body tr').count() !== 1) throw new Error('Duplicate filter failed');
          await page.getByRole('button', {name:'جزئیات'}).click();
          await page.getByText('جزئیات رکورد ۹۹۱۲').waitFor();
          await page.getByRole('button', {name:'بستن'}).last().click();
          if (errors.length) throw new Error('Browser errors: ' + errors.join(' | '));
          await browser.close();
          console.log('BROWSER_QA=PASS');
          JS
          node /tmp/qa-test.mjs
