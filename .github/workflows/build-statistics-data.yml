name: Build statistics data from Excel

on:
  push:
    branches: [development-statistics]
    paths-ignore:
      - frontend/statistics-data.js

permissions:
  contents: write

jobs:
  build-statistics-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install openpyxl

      - name: Build statistics data
        run: python ExcelData/build_statistics_data.py

      - name: Commit generated statistics data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/statistics-data.js
          git diff --cached --quiet && exit 0
          git commit -m "Generate statistics data from master Excel"
          git push
