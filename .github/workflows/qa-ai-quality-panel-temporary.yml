name: Temporary AI Quality Panel QA

on:
  push:
    branches:
      - feature/ai-quality-panel-20261007

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: node --check frontend/ai-quality-panel.js

      - name: Start static server
        run: |
          python3 -m http.server 8000 --directory frontend > /tmp/golzar-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8000/index.html > /dev/null

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run browser QA
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });

            const consoleErrors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });

            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForSelector('#golzar-ai-quality-entry', { timeout: 30000 });

            const entryVisible = await page.locator('#golzar-ai-quality-entry').isVisible();
            if (!entryVisible) throw new Error('AI Quality entry is not visible.');

            const entries = await page.locator('.modular-home-sub-action').count();
            const statsExists = await page.getByText('گزارش‌های آماری', { exact: true }).count();
            if (statsExists !== 1) throw new Error('Statistics entry was not preserved exactly once.');

            await page.locator('#golzar-ai-quality-entry button').click();
            await page.waitForSelector('#golzar-ai-quality-modal', { timeout: 10000 });
            await page.getByText('کنترل کیفیت داده', { exact: true }).first().waitFor();

            const totalText = await page.locator('.golzar-ai-quality-kpi strong').first().textContent();
            if (!totalText || !/[0-9۰-۹]/.test(totalText)) {
              throw new Error('Quality panel opened but total-record KPI is missing.');
            }

            await page.locator('.golzar-ai-quality-close').click();
            if (await page.locator('#golzar-ai-quality-modal').count() !== 0) {
              throw new Error('Quality modal did not close.');
            }

            if (consoleErrors.length) {
              console.error('Browser console errors:', consoleErrors);
              throw new Error('Browser console reported errors.');
            }

            console.log(JSON.stringify({
              status: 'PASS',
              managementActions: entries,
              totalRecordsKpi: totalText,
              qualityEntryVisible: entryVisible,
              modalOpenClose: true
            }, null, 2));

            await browser.close();
          })().catch(async error => {
            console.error(error);
            process.exit(1);
          });
          NODE
